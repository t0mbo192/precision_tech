<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ Title }}</title>
    <link href="/index.css" rel="stylesheet" />
    <link href="/images/logo/true-position.svg" rel="icon" type="image/svg+xml" />
  </head>

  <body>
    <div class="page-shell">
      <div class="terminal">
        <div class="terminal-body">
          <header class="site-header">
            <a class="site-brand" href="/">
              <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <circle cx="16" cy="16" r="9" stroke="currentColor" stroke-width="2" />
                <path d="M16 3v26M3 16h26" stroke="#d97757" stroke-width="2" stroke-linecap="round" />
              </svg>
              <span><span class="prompt-user">tom</span>@<span class="prompt-host">precision-tech</span></span>
            </a>
            <nav class="site-nav" aria-label="Primary navigation">
              <a href="/">~/home</a>
              <a href="/projects">~/projects</a>
              <a href="/contact">~/contact</a>
            </nav>
          </header>

          <article class="page-content">{{ Content }}</article>

          <footer class="site-footer">
            <p class="footer-prompt" aria-hidden="true"><span class="prompt-user">tom</span>@<span class="prompt-host">precision-tech</span>:~$ <span class="cursor">&#9608;</span></p>
          </footer>
        </div>
      </div>
    </div>
  </body>
</html>
